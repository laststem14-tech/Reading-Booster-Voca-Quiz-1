        class AudioSystem {
            constructor() {
                this.ctx = null;
                this.bgmInterval = null;
                this.isBgmPlaying = false;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playTone(freq, duration, type = 'sine', volume = 0.1) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }

            playCorrect() {
                this.init();
                this.playTone(523.25, 0.12, 'triangle', 0.2);
                setTimeout(() => this.playTone(659.25, 0.15, 'triangle', 0.2), 100);
                setTimeout(() => this.playTone(783.99, 0.25, 'triangle', 0.25), 200);
            }

            playWrong() {
                this.init();
                this.playTone(220, 0.15, 'sawtooth', 0.2);
                setTimeout(() => this.playTone(180, 0.25, 'sawtooth', 0.2), 120);
            }

            playTick() {
                this.init();
                this.playTone(800, 0.03, 'sine', 0.05);
            }

            toggleBgm() {
                this.init();
                if (this.isBgmPlaying) {
                    this.stopBgm();
                    return false;
                } else {
                    this.startBgm();
                    return true;
                }
            }

            startBgm() {
                this.isBgmPlaying = true;
                const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
                let step = 0;
                this.bgmInterval = setInterval(() => {
                    if (this.isBgmPlaying) {
                        this.playTone(notes[step % notes.length], 0.4, 'sine', 0.02);
                        step++;
                    }
                }, 600);
            }

            stopBgm() {
                this.isBgmPlaying = false;
                if (this.bgmInterval) clearInterval(this.bgmInterval);
            }
        }

                    content.innerHTML = `
                        <div class="text-center py-4 animate-shake">
                            <div class="w-16 h-16 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-3 shadow-md">
                                <i data-lucide="x-circle" class="w-10 h-10"></i>
                            </div>
                            <h3 class="text-2xl font-bold text-slate-800 font-jua">${isTimeout ? '시간 초과! ⏰' : '아쉽네요! 다시 시도해보세요.'}</h3>
                            <p class="text-slate-600 mt-2 text-sm">정답은 <span class="text-emerald-600 font-bold">${correctAnswerText}</span> 입니다.</p>
                            <button onclick="app.retryVocabQuestion()" class="mt-6 w-full py-3 bg-rose-500 hover:bg-rose-600 text-white rounded-xl font-bold transition shadow-md">
                                이 문제 다시 풀기
                            </button>
                        </div>
                    `;
                }

                modal.classList.remove('hidden');
                lucide.createIcons();
            }

            retryVocabQuestion() {
                document.getElementById('modalOverlay').classList.add('hidden');
                this.renderVocabQuiz();
            }

            nextVocabQuestion() {
                document.getElementById('modalOverlay').classList.add('hidden');
                this.vocabIndex++;
                if (this.vocabIndex < 10) {
                    this.renderVocabQuiz();
                } else {
                    this.compIndex = 0;
                    this.compScore = 0;
                    this.renderComprehensionQuiz();
                }
            }

            renderComprehensionQuiz() {
                this.currentStage = 'comp';
                this.clearAllTimers();
                
                if (this.compIndex === 0) {
                    this.compTimeLeft = 180;
                }

                const q = this.currentPassage.comprehension[this.compIndex];
                const container = document.getElementById('appContainer');

                container.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                        <!-- Left Panel: Reading Passage -->
                        <div class="lg:col-span-6 bg-white rounded-3xl p-6 shadow-xl border-2 border-sky-100 flex flex-col h-full">
                            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                                <span class="text-xs font-bold px-3 py-1 rounded-full bg-sky-100 text-sky-800">Reading Booster 교재 원문</span>
                                <span class="text-xs text-slate-400 font-bold">${this.currentPassage.title}</span>
                            </div>
                            <div class="prose max-w-none text-slate-700 leading-relaxed text-sm md:text-base font-serif bg-sky-50/50 p-5 rounded-2xl border border-sky-100 overflow-y-auto max-h-[380px] lg:max-h-[460px] whitespace-pre-line">
                                ${this.currentPassage.text}
                            </div>
                        </div>

                        <!-- Right Panel: Comprehension Question -->
                        <div class="lg:col-span-6 bg-white rounded-3xl p-6 shadow-xl border-2 border-indigo-100 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-center mb-4">
                                    <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-full border border-indigo-200">
                                        Step 2. 독해 문제 (${this.compIndex + 1} / 3)
                                    </span>
                                    <div class="flex items-center space-x-2 bg-rose-50 px-3 py-1 rounded-full border border-rose-200">
                                        <i data-lucide="clock" class="w-4 h-4 text-rose-500 animate-spin"></i>
                                        <span id="compTimerText" class="text-sm font-black text-rose-600 font-mono">03:00</span>
                                    </div>
                                </div>

                                <h3 class="text-lg md:text-xl font-bold text-slate-800 mb-6 leading-snug font-jua">
                                    ${q.question}
                                </h3>

                                <div class="space-y-3 mb-6">
                                    ${q.options.map((opt, idx) => `
                                        <button onclick="app.checkCompAnswer(${idx})" class="w-full p-4 rounded-2xl border-2 border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-left text-sm md:text-base font-semibold text-slate-700 transition flex items-start space-x-3 shadow-sm">
                                            <span class="w-6 h-6 rounded-lg bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">${idx + 1}</span>
                                            <span class="leading-relaxed">${opt}</span>
                                        </button>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="text-xs text-slate-400 text-center font-medium bg-slate-50 p-3 rounded-xl border border-slate-100">
                                💡 정답 선택 시 교재 해설 기반의 정답 근거가 공개됩니다.
                            </div>
                        </div>
                    </div>
                `;

                lucide.createIcons();
                this.startCompTimer();
            }

            startCompTimer() {
                const timerEl = document.getElementById('compTimerText');
                this.compTimer = setInterval(() => {
                    this.compTimeLeft--;
                    
                    const min = String(Math.floor(this.compTimeLeft / 60)).padStart(2, '0');
                    const sec = String(this.compTimeLeft % 60).padStart(2, '0');
                    if (timerEl) timerEl.innerText = `${min}:${sec}`;

                    if (this.compTimeLeft <= 0) {
                        clearInterval(this.compTimer);
                        this.showCompFeedback(false, true);
                    }
                }, 1000);
            }

            checkCompAnswer(selectedIdx) {
                const q = this.currentPassage.comprehension[this.compIndex];
                const isCorrect = (selectedIdx === q.answer);

                if (isCorrect) {
                    this.compScore++;
                    audioSys.playCorrect();
                    this.showCompFeedback(true);
                } else {
                    audioSys.playWrong();
                    this.showCompFeedback(false);
                }
            }

            showCompFeedback(isCorrect, isTimeout = false) {
                const q = this.currentPassage.comprehension[this.compIndex];
                const modal = document.getElementById('modalOverlay');
                const content = document.getElementById('modalContent');

                if (isCorrect) {
                    confetti({ particleCount: 60, spread: 70, origin: { y: 0.6 } });
                }

                content.innerHTML = `
                    <div class="py-2">
                        <div class="flex items-center space-x-3 mb-3">
                            <div class="w-10 h-10 rounded-full ${isCorrect ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'} flex items-center justify-center">
                                <i data-lucide="${isCorrect ? 'check-circle' : 'alert-circle'}" class="w-6 h-6"></i>
                            </div>
                            <h3 class="text-xl font-bold text-slate-800 font-jua">
                                ${isCorrect ? '정답입니다! 👏' : (isTimeout ? '제한시간 초과!' : '오답입니다')}
                            </h3>
                        </div>

                        <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100 mb-4">
                            <p class="text-xs font-bold text-indigo-700 uppercase mb-1">🔍 교재 해설 기반 정답 근거</p>
                            <p class="text-sm text-slate-700 leading-relaxed font-medium">${q.rationale}</p>
                        </div>

                        <button onclick="app.nextCompQuestion()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition shadow-md">
                            ${this.compIndex < 2 ? '다음 독해 문제로' : '요약 활동으로 이동 (Step 3)'}
                        </button>
                    </div>
                `;

                modal.classList.remove('hidden');
                lucide.createIcons();
            }

            nextCompQuestion() {
                document.getElementById('modalOverlay').classList.add('hidden');
                this.compIndex++;
                if (this.compIndex < 3) {
                    this.renderComprehensionQuiz();
                } else {
                    clearInterval(this.compTimer);
                    this.renderSummaryActivity();
                }
            }

            renderSummaryActivity() {
                this.currentStage = 'summary';
                this.clearAllTimers();
                this.summaryTimeLeft = 240;

                const p = this.currentPassage;
                const container = document.getElementById('appContainer');

                container.innerHTML = `
                    <div class="max-w-3xl mx-auto bg-white rounded-3xl p-6 md:p-8 shadow-xl border-2 border-emerald-100">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-200">
                                Step 3. 3-Key & 1-Sentence 요약하기
                            </span>
                            <div class="flex items-center space-x-2 bg-rose-50 px-3 py-1 rounded-full border border-rose-200">
                                <i data-lucide="timer" class="w-4 h-4 text-rose-500 animate-pulse"></i>
                                <span id="summaryTimerText" class="text-sm font-black text-rose-600 font-mono">04:00</span>
                            </div>
                        </div>

                        <div class="bg-gradient-to-r from-emerald-50 to-teal-50 p-5 rounded-2xl border border-emerald-200 mb-6">
                            <h3 class="text-lg font-bold text-slate-800 font-jua mb-2">📌 스캐폴딩 가이드 (Scaffolding Guide)</h3>
                            <p class="text-sm text-slate-600 mb-3">지문의 핵심 키워드 3가지를 활용하여 전체 핵심 메시지를 **한 문장의 한국어**로 요약해보세요.</p>
                            
                            <div class="flex flex-wrap gap-2 mt-2">
                                <span class="text-xs font-semibold text-slate-500 self-center mr-1">추천 핵심 키워드:</span>
                                ${p.scaffoldingKeywords.map(kw => `
                                    <span class="px-3 py-1 bg-white rounded-lg border border-emerald-300 text-emerald-800 text-xs font-bold shadow-sm">
                                        # ${kw}
                                    </span>
                                `).join('')}
                            </div>
                        </div>

                        <div class="space-y-4 mb-6">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1">학번 (선택)</label>
                                    <input type="text" id="studentNumInput" placeholder="예: 10101" class="w-full p-3 rounded-xl border-2 border-slate-200 focus:border-emerald-500 focus:outline-none text-sm font-semibold">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1">학생 이름 <span class="text-rose-500">*</span></label>
                                    <input type="text" id="studentNameInput" placeholder="예: 홍길동" class="w-full p-3 rounded-xl border-2 border-slate-200 focus:border-emerald-500 focus:outline-none text-sm font-semibold">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">한 문장 요약 작성 (한국어) <span class="text-rose-500">*</span></label>
                                <textarea id="summarySentenceInput" rows="3" placeholder="제시된 키워드를 반영해 지문 주제를 완결된 한 문장으로 정리하세요." class="w-full p-4 rounded-2xl border-2 border-slate-200 focus:border-emerald-500 focus:outline-none text-sm font-medium leading-relaxed"></textarea>
                            </div>
                        </div>

                        <button onclick="app.submitSummary()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-base shadow-lg shadow-emerald-200 transition flex items-center justify-center space-x-2">
                            <i data-lucide="send" class="w-5 h-5"></i>
                            <span>요약 제출 및 학습 완료하기</span>
                        </button>
                    </div>
                `;

                lucide.createIcons();
                this.startSummaryTimer();
            }

            startSummaryTimer() {
                const timerEl = document.getElementById('summaryTimerText');
                this.summaryTimer = setInterval(() => {
                    this.summaryTimeLeft--;
                    
                    const min = String(Math.floor(this.summaryTimeLeft / 60)).padStart(2, '0');
                    const sec = String(this.summaryTimeLeft % 60).padStart(2, '0');
                    if (timerEl) timerEl.innerText = `${min}:${sec}`;

                    if (this.summaryTimeLeft <= 0) {
                        clearInterval(this.summaryTimer);
                        this.submitSummary(true);
                    }
                }, 1000);
            }

            submitSummary(isTimeout = false) {
                const nameInput = document.getElementById('studentNameInput');
                const numInput = document.getElementById('studentNumInput');
                const sentenceInput = document.getElementById('summarySentenceInput');

                const nameVal = nameInput ? nameInput.value.trim() : '';
                const numVal = numInput ? numInput.value.trim() : '';
                const summaryText = sentenceInput ? sentenceInput.value.trim() : '';

                if (!isTimeout && !nameVal) {
                    this.showNoticeModal('이름을 입력하세요', '학습 기록 작성을 위해 학생 이름을 반드시 입력해 주세요.');
                    return;
                }

                if (!isTimeout && summaryText.length < 5) {
                    this.showNoticeModal('문장을 완성해 주세요', '최소 5자 이상의 한 문장 요약이 필요합니다.');
                    return;
                }

                clearInterval(this.summaryTimer);
                const fullName = numVal ? `${nameVal} (${numVal})` : nameVal || '익명 학생';

                this.studentRecords.unshift({
                    name: fullName,
                    passage: `${this.currentPassage.num}번 지문`,
                    vocabScore: `${this.vocabScore}/10`,
                    compScore: `${this.compScore}/3`,
                    summary: summaryText || '(시간 초과 자동 제출)',
                    date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });

                audioSys.playCorrect();
                confetti({ particleCount: 100, spread: 80, origin: { y: 0.5 } });

                const container = document.getElementById('appContainer');
                container.innerHTML = `
                    <div class="max-w-2xl mx-auto bg-white rounded-3xl p-8 text-center shadow-2xl border-4 border-emerald-200">
                        <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                            <i data-lucide="award" class="w-10 h-10"></i>
                        </div>

                        <h2 class="text-3xl font-extrabold text-slate-800 font-jua mb-2">학습 완료! 수고하셨습니다 🎓</h2>
                        <p class="text-slate-600 text-sm mb-6">${fullName} 학생의 기록이 교사 대시보드에 성공적으로 등록되었습니다.</p>

                        <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 text-left space-y-4 mb-6">
                            <div class="flex justify-between items-center border-b border-slate-200 pb-2">
                                <span class="text-sm font-semibold text-slate-600">어휘 퀴즈 점수</span>
                                <span class="text-base font-black text-amber-600 font-mono">${this.vocabScore} / 10 점</span>
                            </div>
                            <div class="flex justify-between items-center border-b border-slate-200 pb-2">
                                <span class="text-sm font-semibold text-slate-600">독해 문제 점수</span>
                                <span class="text-base font-black text-indigo-600 font-mono">${this.compScore} / 3 점</span>
                            </div>
                            <div>
                                <span class="text-xs font-bold text-slate-400 block mb-1">내가 작성한 한 문장 요약</span>
                                <p class="text-sm text-slate-700 italic bg-white p-3 rounded-xl border border-slate-200">"${summaryText || '미작성'}"</p>
                            </div>
                            <div class="bg-emerald-50 p-3.5 rounded-xl border border-emerald-200">
                                <span class="text-xs font-bold text-emerald-800 block mb-1">💡 예시 답안 (권장 요약)</span>
                                <p class="text-sm text-emerald-900 font-medium">${this.currentPassage.sampleSummary}</p>
                            </div>
                        </div>

                        <div class="flex flex-col sm:flex-row gap-3">
                            <button onclick="app.navHome()" class="flex-1 py-3.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold transition shadow-md">
                                다른 지문 학습하기
                            </button>
                            <button onclick="app.openDashboard()" class="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition shadow-md">
                                대시보드 확인하기
                            </button>
                        </div>
                    </div>
                `;

                lucide.createIcons();
            }

            showNoticeModal(title, message) {
                const modal = document.getElementById('modalOverlay');
                const content = document.getElementById('modalContent');
                content.innerHTML = `
                    <div class="text-center py-4">
                        <i data-lucide="alert-circle" class="w-12 h-12 text-amber-500 mx-auto mb-2"></i>
                        <h3 class="text-xl font-bold text-slate-800 font-jua">${title}</h3>
                        <p class="text-sm text-slate-600 mt-2">${message}</p>
                        <button onclick="document.getElementById('modalOverlay').classList.add('hidden')" class="mt-4 px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-bold">확인</button>
                    </div>
                `;
                modal.classList.remove('hidden');
                lucide.createIcons();
            }

            openDashboard() {
                this.clearAllTimers();
                this.currentStage = 'dashboard';
                const container = document.getElementById('appContainer');

                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-3xl shadow-md border border-slate-100">
                            <div>
                                <h2 class="text-2xl font-black text-slate-800 font-jua flex items-center gap-2">
                                    <i data-lucide="layout-dashboard" class="w-6 h-6 text-indigo-600"></i>
                                    교사용 학습 분석 대시보드
                                </h2>
                                <p class="text-xs text-slate-500 mt-1">Reading Booster 고난도 01회 (31~40번) 교재 기반 실시간 현황</p>
                            </div>

                            <div class="flex items-center space-x-3">
                                <button onclick="app.shareToGoogleClassroom()" class="flex items-center space-x-2 px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm shadow-md transition">
                                    <i data-lucide="share-2" class="w-4 h-4"></i>
                                    <span>Google Classroom 공유</span>
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div class="bg-gradient-to-tr from-blue-50 to-indigo-50 p-5 rounded-2xl border border-blue-100 shadow-sm">
                                <span class="text-xs font-bold text-blue-600">총 제출 건수</span>
                                <h3 class="text-3xl font-black text-slate-800 font-mono mt-1">${this.studentRecords.length}건</h3>
                            </div>
                            <div class="bg-gradient-to-tr from-amber-50 to-orange-50 p-5 rounded-2xl border border-amber-100 shadow-sm">
                                <span class="text-xs font-bold text-amber-600">어휘 평균 정답률</span>
                                <h3 class="text-3xl font-black text-slate-800 font-mono mt-1">90%</h3>
                            </div>
                            <div class="bg-gradient-to-tr from-emerald-50 to-teal-50 p-5 rounded-2xl border border-emerald-100 shadow-sm">
                                <span class="text-xs font-bold text-emerald-600">독해 완수율</span>
                                <h3 class="text-3xl font-black text-slate-800 font-mono mt-1">96%</h3>
                            </div>
                        </div>

                        <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-100">
                            <h3 class="text-lg font-bold text-slate-800 font-jua mb-4 flex items-center justify-between">
                                <span>📋 학생 활동 현황</span>
                                <span class="text-xs font-normal text-slate-400">실시간 연동</span>
                            </h3>

                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-slate-50 text-slate-500 text-xs font-bold border-b border-slate-200">
                                            <th class="p-3">학생명 (학번)</th>
                                            <th class="p-3">학습 지문</th>
                                            <th class="p-3 text-center">어휘 성적</th>
                                            <th class="p-3 text-center">독해 성적</th>
                                            <th class="p-3">한 문장 요약 작성 내용</th>
                                            <th class="p-3 text-center">제출 시간</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100 text-sm">
                                        ${this.studentRecords.map(r => `
                                            <tr class="hover:bg-slate-50/80 transition">
                                                <td class="p-3 font-bold text-slate-800">${r.name}</td>
                                                <td class="p-3 text-slate-600 font-medium">${r.passage}</td>
                                                <td class="p-3 text-center font-bold text-amber-600 font-mono">${r.vocabScore}</td>
                                                <td class="p-3 text-center font-bold text-indigo-600 font-mono">${r.compScore}</td>
                                                <td class="p-3 text-slate-700 italic max-w-xs truncate">${r.summary}</td>
                                                <td class="p-3 text-center text-xs text-slate-400">${r.date}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;

                lucide.createIcons();
            }

            shareToGoogleClassroom() {
                const currentUrl = window.location.href;
                const shareUrl = `https://classroom.google.com/share?url=${encodeURIComponent(currentUrl)}&title=${encodeURIComponent('Reading Booster 고난도 01회 (31-40번) 영어 독해 과제')}`;
                window.open(shareUrl, '_blank', 'width=600,height=600');
            }
        }

        let app;
        window.onload = () => {
            app = new App();
        };
    </script>
</body>
</html>
